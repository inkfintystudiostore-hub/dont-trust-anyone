<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Don't Trust Anyone</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='34' r='24' fill='%23fffbf7' stroke='%238b0d1a' stroke-width='5'/><circle cx='24' cy='32' r='4' fill='%231f1916'/><circle cx='40' cy='32' r='4' fill='%231f1916'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="game" aria-label="Game"></canvas>
  <div id="iris" aria-hidden="true"></div>

  <div id="hud" hidden>
    <div class="hud-left">
      <div class="pill" id="level-name"></div>
      <button class="pill btn-pill" id="btn-map" title="Level Map (M / Esc)" aria-label="Level Map">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 7v13l6-3 6 3 6-3V4l-6 3-6-3Z"/><path d="M9 4v13M15 7v13"/></svg>
      </button>
      <button class="pill btn-pill" id="btn-restart" title="Restart (R)" aria-label="Restart">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="pill btn-pill" id="btn-mute" title="Sound" aria-label="Sound" aria-pressed="false"></button>
      <button class="pill btn-pill" id="btn-fullscreen" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false">
        <span class="ico-wrap" aria-hidden="true"></span><span class="fs-label">Full</span>
      </button>
      <button class="pill btn-pill" id="btn-leave" hidden title="Leave Co-op Room" aria-label="Leave Co-op Room">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
    <div class="hud-right">
      <div class="pill door-badge" id="door-badge" hidden></div>
      <div class="pill flip-badge" id="flip-badge" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        <span data-i18n="hud.flipped"></span>
      </div>
      <div class="pill deaths" title="Deaths">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="7"/><path d="M9 18v3M12 18v3M15 18v3"/><circle cx="9.5" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="11" r="1" fill="currentColor" stroke="none"/></svg>
        <b id="deaths">0</b>
      </div>
    </div>
  </div>

  <div id="rotate-hint" hidden data-i18n="hud.rotate"></div>
  <div id="taunt" class="bubble" role="status" aria-live="polite" hidden>
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg>
    <span id="taunt-text"></span>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <section id="menu" class="overlay" role="dialog" aria-modal="true" aria-label="Main Menu" hidden>
    <div class="card">
      <h1 data-i18n="menu.title"></h1>
      <p class="sub" data-i18n="menu.sub"></p>
      <button id="play" class="btn" data-i18n="menu.solo"></button>
      <button id="open-map" class="btn ghost" data-i18n="menu.map"></button>
      <button id="open-coop" class="btn ghost" data-i18n="menu.online"></button>
      <p class="keys" data-i18n="menu.keys"></p>
    </div>
  </section>

  <section id="coop" class="overlay" role="dialog" aria-modal="true" aria-label="2-Player Co-op Lobby" hidden>
    <div class="card coop-card">
      <div class="map-head">
        <div><h2 data-i18n="coop.title"></h2></div>
        <button id="coop-close" class="pill btn-pill" aria-label="Back">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="sub coop-rule" data-i18n="coop.rule"></p>
      <div class="coop-tabs">
        <button id="coop-tab-create" class="tab on" type="button" data-i18n="coop.tabCreate"></button>
        <button id="coop-tab-join" class="tab" type="button" data-i18n="coop.tabJoin"></button>
      </div>
      <label class="field-label" for="coop-name" data-i18n="coop.nameLabel"></label>
      <input id="coop-name" class="field" type="text" maxlength="18" autocomplete="off" placeholder="Momo / Mimi">

      <div id="coop-create-pane">
        <div class="room-box">
          <div class="room-code" id="coop-code">--- --- ---</div>
          <div class="room-actions">
            <button id="coop-copy-code" class="pill btn-pill" type="button" data-i18n="coop.copyCode"></button>
            <button id="coop-copy-link" class="pill btn-pill" type="button" data-i18n="coop.copyLink"></button>
          </div>
        </div>
        <div id="coop-start-note" class="coop-start-note" data-i18n="coop.startL1Note"></div>
      </div>

      <div id="coop-join-pane" hidden>
        <div class="join-row">
          <input id="coop-join-input" class="field" type="text" autocomplete="off" aria-label="Room code or invite link" placeholder="482-910-375 ya invite link">
          <button id="coop-join-btn" class="btn join-go" type="button" data-i18n="coop.joinBtn"></button>
        </div>
      </div>

      <div id="coop-roster" class="roster"></div>
      <p id="coop-status" class="coop-status" role="status" aria-live="polite"></p>
      <button id="coop-start" class="btn" type="button" hidden data-i18n="coop.startBtn"></button>
    </div>
  </section>

  <section id="map" class="overlay map-overlay" role="dialog" aria-modal="true" aria-label="Level Map" hidden>
    <div class="card map-card">
      <div class="map-head">
        <div>
          <h2 id="map-selected-title">Level 1</h2>
        </div>
        <button id="map-close" class="pill btn-pill" aria-label="Back">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="world-tabs" id="world-tabs">
        <button class="tab on" data-w="0" data-i18n="world.1"></button>
        <button class="tab" data-w="1" data-i18n="world.2"></button>
        <button class="tab" data-w="2" data-i18n="world.3"></button>
        <button class="tab" data-w="3" data-i18n="world.4"></button>
        <button class="tab" data-w="4" data-i18n="world.5"></button>
      </div>
      <div class="level-grid" id="level-grid"></div>
      <button id="map-play" class="btn" data-i18n="map.play"></button>
    </div>
  </section>

  <section id="end" class="overlay" role="dialog" aria-modal="true" aria-label="Victory Screen" hidden>
    <div class="card">
      <h1 data-i18n="end.title"></h1>
      <p class="sub" data-i18n="end.sub"></p>
      <p id="end-wait-guest" class="sub" hidden data-i18n="coop.waitAgain"></p>
      <button id="again" class="btn" data-i18n="end.again"></button>
      <button id="end-map" class="btn ghost" data-i18n="menu.map"></button>
      <button id="end-leave" class="btn ghost" hidden data-i18n="coop.leave"></button>
    </div>
  </section>

  <div id="touch" hidden>
    <div id="joy-zone" class="joy-zone" role="group" aria-label="Move Joystick">
      <div id="joy-base" class="joy-base">
        <span class="joy-arrows" aria-hidden="true">◀&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;▶</span>
        <span id="joy-down-hint" class="joy-down-hint" aria-hidden="true">▼</span>
        <div id="joy-knob" class="joy-knob"></div>
      </div>
    </div>
    <div class="touch-actions">
      <button data-k="restart" class="mini" aria-label="Restart"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button data-k="jump" class="jump" aria-label="Jump"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg></button>
    </div>
  </div>

  <div id="loading" class="overlay"><div class="card"><h1 data-i18n="loading.title"></h1></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
