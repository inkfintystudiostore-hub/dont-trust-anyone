name = "dont-trust-anyone"
main = "worker/index.js"
compatibility_date = "2026-04-01"
workers_dev = true
routes = [
  { pattern = "dta.inkfinitystudio.store", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "DontTrustRoomDO"

[[durable_objects.bindings]]
name = "PLAYER_ACCOUNT"
class_name = "AccountDO"

[[durable_objects.bindings]]
name = "PLAYER_WALLET"
class_name = "PlayerWalletDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DontTrustRoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountDO", "PlayerWalletDO"]
