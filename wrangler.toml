name = "dont-trust-anyone"
main = "worker/index.js"
compatibility_date = "2026-04-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "DontTrustRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DontTrustRoomDO"]
